name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install --profile minimal
      - name: Check formatting
        run: cargo fmt --check
      - name: Check
        run: cargo check --locked
      - name: Check release version consistency
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          scripts/verify_release_version.sh "v$VERSION"
      - name: Lint
        run: cargo clippy --locked -- -D warnings
      - name: Test
        run: cargo test --locked --quiet
      - name: Check parser fuzz target
        run: CARGO_TARGET_DIR=target cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Check skill installer
        run: scripts/check_install_skill.sh
      - name: Check npm package shape
        run: RELATED_NPM_ALLOW_MISSING_PREBUILT=1 npm pack --dry-run
      - name: Check packaged npm installer
        run: scripts/check_npm_package.sh

  cross-platform-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install --profile minimal
      - name: Test
        run: cargo test --locked --quiet
      - name: Smoke test npm runtime wrapper
        shell: bash
        run: |
          cargo build --locked
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          case "$HOST" in
            *-windows-*) BINARY="related.exe" ;;
            *) BINARY="related" ;;
          esac
          mkdir -p "npm/prebuilt/$HOST"
          cp "target/debug/$BINARY" "npm/prebuilt/$HOST/$BINARY"
          ACTUAL_VERSION="$(node npm/bin/related.js --version | tr -d '\r')"
          EXPECTED_VERSION="related $(node -p "require('./package.json').version")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
