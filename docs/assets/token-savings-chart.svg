<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Token count reduction with related-cli</title>
  <desc id="desc">A before and after chart showing command-output tokens drop from 16,381 without related-cli to 231 with related-cli.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="costStripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#475569"/>
      <rect width="8" height="28" fill="#991b1b" opacity="0.55"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #9ca3af; }
      .strong { fill: #f8fafc; }
      .grid { stroke: #334155; stroke-width: 2; opacity: 0.45; }
      .tick { fill: #94a3b8; font-size: 24px; }
    </style>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>
  <path d="M90 298H1510" class="grid"/>
  <path d="M90 542H1510" class="grid"/>

  <text x="90" y="105" class="sans strong" font-size="52" font-weight="760">Token savings before reading source</text>
  <text x="90" y="155" class="sans muted" font-size="28">VS Code Codex smoke test: same first companion file after adding related-cli.</text>

  <g transform="translate(90 225)">
    <text x="0" y="0" class="sans muted" font-size="26">Before: without related-cli</text>
    <text x="0" y="48" class="mono strong" font-size="48" font-weight="760">16,381 tokens</text>
    <rect x="500" y="10" width="900" height="58" rx="12" fill="url(#costStripes)" stroke="#ef4444" stroke-width="2" opacity="0.92" filter="url(#softShadow)"/>
    <text x="1425" y="48" class="sans" fill="#fecaca" font-size="26" text-anchor="end">forced source-body read</text>
  </g>

  <g transform="translate(90 335)">
    <path d="M512 0V58" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <path d="M500 47L512 62L524 47" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="545" y="38" class="sans" fill="#99f6e4" font-size="24">add related-cli shortlist</text>
  </g>

  <g transform="translate(90 455)">
    <text x="0" y="0" class="sans muted" font-size="26">After: with related-cli</text>
    <text x="0" y="48" class="mono strong" font-size="48" font-weight="760">231 tokens</text>
    <rect x="500" y="10" width="24" height="58" rx="12" fill="url(#teal)" filter="url(#softShadow)"/>
    <text x="550" y="48" class="sans" fill="#99f6e4" font-size="26">compact top-10 related-file shortlist</text>
  </g>

  <g transform="translate(90 635)">
    <rect x="0" y="-42" width="430" height="72" rx="10" fill="#0f766e" opacity="0.24" stroke="#2dd4bf" stroke-width="2"/>
    <text x="24" y="4" class="sans" fill="#ccfbf1" font-size="30" font-weight="720">70.9x less command output</text>
  </g>
</svg>
